[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hakisa"
version = "2.0.0"
description = "Hakisa: an efficient, from-scratch visual game-playing agent (behaviour cloning + RL) with an optional Qwen3 System-2 planner"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Martyn0324" }]
dependencies = [
    "numpy>=1.26",
    "torch>=2.4",
    "pyyaml>=6.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
# Real games on Windows: fast DXGI capture + input hooks (+ mss as a fallback capture backend)
windows = ["dxcam>=0.0.5", "pynput>=1.7", "mss>=9.0"]
capture = ["mss>=9.0", "pynput>=1.7"]
cv = ["opencv-python>=4.8"]
llm = ["transformers>=4.51", "safetensors>=0.4", "tokenizers>=0.21"]
play = ["pygame>=2.5"]
viz = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "matplotlib>=3.8"]

[project.scripts]
hakisa = "hakisa.cli:main"

[tool.setuptools.packages.find]
include = ["hakisa*"]

[tool.setuptools.package-data]
hakisa = ["games/*.yaml", "games/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
